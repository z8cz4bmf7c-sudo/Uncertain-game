<script>
/*
 UNCERTAIN v10.16
 Single-paste upgrade for the current v10.11 index.html.

 Paste this entire block immediately BEFORE </body>.
 No extra files required.
*/

(()=>{
"use strict";


/* VERSION */

document.title=
"UNCERTAIN — Checking District v10.16";


const scene=
document.querySelector(
  "#scene"
);


if(
  !scene ||
  document.querySelector(
    "#v1016Upgrade"
  )
){
  return;
}


/* MARKER */

const marker=
document.createElement(
  "div"
);

marker.id=
"v1016Upgrade";

marker.hidden=
true;

document.body
.appendChild(
  marker
);


/* NEW MOBILE UI */

const style=
document.createElement(
  "style"
);


style.textContent=`

/* DOUBT PRESENCE */

#doubtPresence{

  position:absolute;

  z-index:34;

  right:14px;

  top:max(
    112px,
    calc(
      env(safe-area-inset-top) + 92px
    )
  );

  width:74px;
  height:74px;

  border-radius:50%;

  pointer-events:none;

  display:none;

  place-items:center;

  background:

  radial-gradient(
    circle at 38% 32%,
    #e4d4eb 0 7%,
    transparent 8%
  ),

  radial-gradient(
    circle at 62% 32%,
    #e4d4eb 0 7%,
    transparent 8%
  ),

  radial-gradient(
    circle at 50% 59%,
    #1b0f27 0 15%,
    transparent 16%
  ),

  radial-gradient(
    circle at 50% 50%,
    #56386e 0 46%,
    #2c193d 64%,
    #140b1e 100%
  );

  border:
  2px solid #e6d4ed55;

  box-shadow:
  0 10px 28px #0009,
  0 0 22px #a94de52b;

  transform:
  scale(.75);

  opacity:.58;

  transition:
  transform .22s ease,
  opacity .22s ease,
  filter .22s ease;

}


#doubtPresence::after{

  content:"?";

  font-size:33px;

  font-weight:1000;

  color:#f3eaf7;

  text-shadow:
  0 3px 9px #000;

}


#doubtPresence.feed{

  animation:
  doubtFeed .34s ease-out;

}


#doubtPresence.release{

  animation:
  doubtRelease .42s ease-out;

}


@keyframes doubtFeed{

  45%{

    filter:
    brightness(1.55);

  }

}


@keyframes doubtRelease{

  45%{

    filter:
    brightness(.72);

  }

}


/* LOOP GRIP + WHAT MATTERS */

#loopGripPanel,
#whatMatters{

  position:absolute;

  z-index:35;

  pointer-events:none;

  border:
  1px solid #ffffff28;

  border-radius:14px;

  background:#081321e8;

  box-shadow:
  0 8px 22px #0007;

}


#loopGripPanel{

  right:10px;

  top:max(
    198px,
    calc(
      env(safe-area-inset-top) + 178px
    )
  );

  width:126px;

  padding:
  8px 9px 9px;

  display:none;

}


#whatMatters{

  left:12px;

  top:max(
    116px,
    calc(
      env(safe-area-inset-top) + 96px
    )
  );

  max-width:190px;

  padding:
  9px 11px;

  display:none;

  border-color:
  #74e7c54a;

}


.v1016Row{

  display:flex;

  justify-content:
  space-between;

  gap:8px;

  margin-bottom:5px;

}


.v1016Label{

  font-size:9px;

  font-weight:1000;

  letter-spacing:.12em;

  color:#dac5e3;

}


#whatMatters .v1016Label{

  display:block;

  color:#74e7c5;

  margin-bottom:4px;

}


#loopGripState{

  font-size:9px;

  font-weight:950;

  color:#d5dfeb;

}


#loopGripTrack{

  height:7px;

  border-radius:999px;

  overflow:hidden;

  background:#ffffff20;

}


#loopGripTrack i{

  display:block;

  width:24%;

  height:100%;

  border-radius:999px;

  background:#d6b6df;

  transition:
  width .22s ease;

}


.v1016Note{

  margin-top:6px;

  font-size:8px;

  line-height:1.25;

  color:#aebbd0;

}


#whatMattersText{

  font-size:11px;

  line-height:1.3;

  font-weight:850;

  color:#f5fbf8;

}


/* ONE-TIME EXPLANATION */

#behaviorLegend{

  position:absolute;

  z-index:36;

  left:12px;
  right:12px;

  bottom:max(
    178px,
    calc(
      env(safe-area-inset-bottom) + 168px
    )
  );

  padding:
  7px 10px;

  border-radius:12px;

  background:#07111dd9;

  border:
  1px solid #ffffff20;

  display:none;

  pointer-events:none;

  font-size:9px;

  line-height:1.25;

  color:#c4cfdb;

  text-align:center;

}


#behaviorLegend b{

  color:#f5fbff;

}


#behaviorLegend .sep{

  opacity:.42;

  padding:
  0 4px;

}


/* SHORT PHONE SCREENS */

@media(max-height:700px){

  #doubtPresence{

    width:62px;
    height:62px;

    top:max(
      104px,
      calc(
        env(safe-area-inset-top) + 84px
      )
    );

  }


  #doubtPresence::after{

    font-size:27px;

  }


  #loopGripPanel{

    top:max(
      174px,
      calc(
        env(safe-area-inset-top) + 154px
      )
    );

    width:114px;

  }


  #whatMatters{

    top:max(
      104px,
      calc(
        env(safe-area-inset-top) + 84px
      )
    );

    max-width:160px;

  }


  #behaviorLegend{

    bottom:max(
      164px,
      calc(
        env(safe-area-inset-bottom) + 154px
      )
    );

  }

}


/* ACCESSIBILITY */

@media(prefers-reduced-motion:reduce){

  #doubtPresence,
  #loopGripTrack i{

    transition:none!important;

    animation:none!important;

  }

}

`;


document.head
.appendChild(
  style
);


/* DOUBT CHARACTER */

const presence=
document.createElement(
  "div"
);


presence.id=
"doubtPresence";


presence.setAttribute(
  "aria-hidden",
  "true"
);


scene.appendChild(
  presence
);


/* LOOP GRIP PANEL */

const grip=
document.createElement(
  "div"
);


grip.id=
"loopGripPanel";


grip.setAttribute(
  "aria-hidden",
  "true"
);


grip.innerHTML=`

<div class="v1016Row">

  <span class="v1016Label">

    LOOP GRIP

  </span>

  <span id="loopGripState">

    LOW

  </span>

</div>


<div id="loopGripTrack">

  <i></i>

</div>


<div class="v1016Note">

  Tracks certainty-seeking,
  not anxiety.

</div>

`;


scene.appendChild(
  grip
);


/* VALUES ANCHOR */

const matters=
document.createElement(
  "div"
);


matters.id=
"whatMatters";


matters.setAttribute(
  "aria-hidden",
  "true"
);


matters.innerHTML=`

<span class="v1016Label">

  WHAT MATTERS

</span>


<span id="whatMattersText">

  Continue with your day.

</span>

`;


scene.appendChild(
  matters
);


/* BEHAVIOR LEGEND */

const legend=
document.createElement(
  "div"
);


legend.id=
"behaviorLegend";


legend.setAttribute(
  "aria-hidden",
  "true"
);


legend.innerHTML=

  `<b>URGE WAVE</b> = what you feel `+

  `<span class="sep">•</span>`+

  `<b>LOOP GRIP</b> = what the checking loop is getting`;


scene.appendChild(
  legend
);


/* MISSION VALUES */

const values={

  door:
  "Leave home and continue your day.",

  car:
  "Go where you were headed.",

  stove:
  "Leave the kitchen and continue."

};


/* LOOP GRIP STATE */

let gripValue=
24;


let lastChecks=

typeof checks==="number"

? checks

: 0;


let lastMomentum=

typeof momentum==="number"

? momentum

: 0;


let lastCurrent=

typeof current!=="undefined"

? current

: null;


let lastPhase=

typeof phase!=="undefined"

? phase

: "idle";


let legendShownForMission=
false;


const clamp=
(
  number,
  minimum,
  maximum
)=>

Math.max(
  minimum,
  Math.min(
    maximum,
    number
  )
);


/* VISUAL RESPONSE */

function pulse(type){


  presence.classList.remove(
    "feed",
    "release"
  );


  void presence.offsetWidth;


  presence.classList.add(
    type
  );


  setTimeout(()=>{


    presence.classList.remove(
      type
    );


  },460);


}



function render(){


  const value=
  clamp(
    gripValue,
    0,
    100
  );


  presence.style.transform=
  `scale(${.68+value*.0048})`;


  presence.style.opacity=
  String(
    clamp(
      .48+
      value*.0044,
      .48,
      .92
    )
  );


  document
  .querySelector(
    "#loopGripTrack i"
  )
  .style.width=
  value+"%";


  document
  .querySelector(
    "#loopGripState"
  )
  .textContent=

  value>=72

  ? "STRONG"

  : value>=42

  ? "ACTIVE"

  : "LOW";


}



function announceSafe(text){


  if(
    typeof announce===
    "function"
  ){


    announce(
      text
    );


  }


}


/* STATE OBSERVER */

function tick(){


  const nowCurrent=

  typeof current!=="undefined"

  ? current

  : null;


  const nowChecks=

  typeof checks==="number"

  ? checks

  : 0;


  const nowMomentum=

  typeof momentum==="number"

  ? momentum

  : 0;


  const nowPhase=

  typeof phase!=="undefined"

  ? phase

  : "idle";


  const missionVisible=
  Boolean(

    document.querySelector(
      "#mission.active"
    ) &&

    nowCurrent

  );


  /*
  NEW MISSION
  */


  if(
    nowCurrent!==
    lastCurrent
  ){


    gripValue=
    24;


    lastChecks=
    nowChecks;


    lastMomentum=
    nowMomentum;


    legendShownForMission=
    false;


    document
    .querySelector(
      "#whatMattersText"
    )
    .textContent=

    values[
      nowCurrent
    ] ||

    "Continue with what matters to you.";


  }


  /*
  RE-CHECKING FEEDS LOOP GRIP

  Anxiety reduction is NOT
  treated as success.
  */


  if(
    nowChecks>
    lastChecks
  ){


    gripValue=
    clamp(

      gripValue+

      24*
      (
        nowChecks-
        lastChecks
      ),

      0,

      100

    );


    pulse(
      "feed"
    );


    announceSafe(
      "The Loop grabbed for more certainty. You can still return to what matters."
    );


  }


  /*
  ACTUAL MOVEMENT REDUCES
  LOOP GRIP.

  This is independent from
  the Urge Wave meter.
  */


  if(
    nowMomentum>
    lastMomentum &&

    nowPhase===
    "moving"
  ){


    const before=
    gripValue;


    gripValue=
    clamp(

      gripValue-

      (
        nowMomentum-
        lastMomentum
      )*.72,

      8,

      100

    );


    if(
      before>=55 &&
      gripValue<55
    ){


      pulse(
        "release"
      );


    }


  }


  /*
  AFTER TEMPORARY RELIEF,
  BRIEFLY EMPHASIZE THE
  PLAYER'S DIRECTION.
  */


  if(
    lastPhase==="relief" &&
    nowPhase==="ready"
  ){


    const anchor=
    document.querySelector(
      "#whatMatters"
    );


    anchor.style.transform=
    "scale(1.03)";


    setTimeout(()=>{


      if(anchor){


        anchor.style.transform=
        "scale(1)";


      }


    },220);


  }


  /*
  EXPLAIN URGE VS BEHAVIOR
  ONCE PER MISSION.
  */


  if(
    missionVisible &&

    !legendShownForMission &&

    nowPhase!=="lock"
  ){


    legendShownForMission=
    true;


    legend.style.display=
    "block";


    setTimeout(()=>{


      legend.style.display=
      "none";


    },2600);


  }


  presence.style.display=

  missionVisible

  ? "grid"

  : "none";


  grip.style.display=

  missionVisible

  ? "block"

  : "none";


  matters.style.display=

  missionVisible

  ? "block"

  : "none";


  lastChecks=
  nowChecks;


  lastMomentum=
  nowMomentum;


  lastCurrent=
  nowCurrent;


  lastPhase=
  nowPhase;


  render();


  requestAnimationFrame(
    tick
  );


}


render();


requestAnimationFrame(
  tick
);


})();

</script>
