<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101c">

<title>UNCERTAIN — Checking District v10.11</title>

<style>
:root{
  --bg:#07101c;
  --panel:#0b1523ee;
  --text:#f7fbff;
  --muted:#aebbd0;
  --accent:#74e7c5;
  --line:#ffffff26
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:#040912;
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button{
  font:inherit;
  color:inherit;
  -webkit-appearance:none;
  appearance:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none
}

#app{
  height:100vh;
  height:100dvh;
  max-width:520px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:var(--bg);
  touch-action:none
}

.btn,
.control,
.missionCard,
.node,
.missionExit,
#fobLock,
#stoveControl{
  touch-action:manipulation
}

#forwardBtn{
  touch-action:none
}

.screen{
  display:none;
  position:absolute;
  inset:0
}

.screen.active{
  display:block
}

.hud{
  position:absolute;
  z-index:80;
  top:0;
  left:0;
  right:0;
  padding:max(12px,env(safe-area-inset-top)) 12px 8px;
  display:flex;
  justify-content:space-between;
  pointer-events:none
}

.pill{
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#07111de8;
  font-size:12px;
  font-weight:950
}

.card{
  background:linear-gradient(180deg,#101d30f2,#0b1625f2);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  box-shadow:0 18px 44px #0009
}

.btn{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:17px;
  background:#eef3f8;
  color:#0c1420;
  font-weight:950;
  font-size:17px
}

.btn.secondary{
  margin-top:10px;
  background:#152238;
  color:#f7fbff;
  border:1px solid #ffffff2a
}

.small{
  font-size:12px;
  line-height:1.4;
  color:#9eacbd
}


/* START */

#start{
  padding:92px 22px 26px;
  background:
  radial-gradient(
    circle at 50% 25%,
    #355271,
    #111b2a 55%,
    #060b13
  )
}

.logo{
  font-size:13px;
  letter-spacing:.25em;
  font-weight:950;
  color:#a9b7ca
}

.hero{
  font-size:53px;
  line-height:.92;
  margin:24px 0 16px;
  font-weight:1000;
  letter-spacing:-.055em
}

.hero span{
  color:var(--accent)
}

.startCard{
  position:absolute;
  left:16px;
  right:16px;
  bottom:max(
    22px,
    env(safe-area-inset-bottom)
  )
}


/* MAP */

#map{
  background:
  linear-gradient(
    145deg,
    #29425f,
    #112238 64%,
    #07101c
  )
}

.road{
  position:absolute;
  width:155%;
  height:100px;
  left:-30%;
  top:49%;
  transform:rotate(-18deg);
  background:#46566c;
  box-shadow:0 0 0 9px #1d2837
}

.road:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:48px;
  border-top:4px dashed #e8edf566
}

.node{
  position:absolute;
  border:2px solid #ffffff32;
  background:#0b1729ed;
  border-radius:23px;
  padding:15px;
  text-align:left;
  box-shadow:0 16px 36px #0009
}

.node strong{
  display:block;
  font-size:18px
}

.node small{
  opacity:.72
}

#checking{
  left:6%;
  top:21%;
  width:195px
}

.locked{
  right:5%;
  bottom:25%;
  width:170px;
  opacity:.48
}

.avatarMini{
  position:absolute;
  left:47%;
  top:63%;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#eef3f8;
  border:7px solid #405675
}

.mapInfo{
  position:absolute;
  left:14px;
  right:14px;
  bottom:max(
    14px,
    env(safe-area-inset-bottom)
  );
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#081321d9
}


/* MISSION SELECT */

#missionSelect{
  background:
  radial-gradient(
    circle at 50% 30%,
    #274762,
    #0b1625 65%
  )
}

.selectWrap{
  position:absolute;
  inset:88px 14px 18px;
  overflow:auto;
  padding-bottom:30px
}

.missionCard{
  width:100%;
  border:1px solid var(--line);
  border-radius:22px;
  background:#0d192aef;
  padding:17px;
  text-align:left;
  margin-bottom:12px;
  min-height:118px
}

.missionCard b{
  display:block;
  font-size:20px
}

.missionCard span{
  display:block;
  color:#b7c5d6;
  margin-top:7px;
  line-height:1.35
}

.tag{
  font-size:11px!important;
  color:var(--accent)!important;
  font-weight:900;
  letter-spacing:.08em
}

.completion{
  min-height:15px;
  font-size:11px!important;
  color:var(--accent)!important;
  font-weight:950!important;
  letter-spacing:.05em
}


/* EXIT BUTTON */

.missionExit{
  position:absolute;
  z-index:9999;
  left:12px;
  top:max(
    58px,
    calc(
      env(safe-area-inset-top) + 48px
    )
  );
  min-width:82px;
  min-height:46px;
  padding:8px 13px;
  border:1px solid #ffffff42;
  border-radius:999px;
  background:#08111bf2;
  color:#f5f8fc;
  box-shadow:0 6px 18px #0008;
  font-size:12px;
  font-weight:950;
  letter-spacing:.04em;
  pointer-events:auto
}


/* SCENE */

.scene{
  position:absolute;
  z-index:1;
  inset:0;
  overflow:hidden;
  background:
  linear-gradient(
    #24364b 0 47%,
    #101923 47%
  )
}

#environment{
  position:absolute;
  inset:0;
  transition:
  transform .12s linear,
  filter .12s linear,
  opacity .12s linear
}

.skyGlow{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:38%;
  background:
  radial-gradient(
    circle at 70% 16%,
    #526d8a55,
    transparent 30%
  )
}

.ground{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:58%;
  background:
  linear-gradient(
    #1f2b37,
    #111923
  )
}

.path{
  position:absolute;
  left:50%;
  bottom:-4%;
  width:56%;
  height:60%;
  transform:
  translateX(-50%)
  perspective(300px)
  rotateX(58deg);
  transform-origin:center bottom;
  background:
  linear-gradient(
    90deg,
    #334251,
    #536578 50%,
    #334251
  );
  clip-path:
  polygon(
    38% 0,
    62% 0,
    100% 100%,
    0 100%
  )
}

.destinationGlow{
  position:absolute;
  left:50%;
  top:19%;
  width:80px;
  height:80px;
  transform:translateX(-50%);
  border-radius:50%;
  background:
  radial-gradient(
    circle,
    #74e7c555,
    transparent 68%
  );
  animation:pulse 1.8s infinite alternate;
  pointer-events:none
}

@keyframes pulse{
  to{
    transform:
    translateX(-50%)
    scale(1.15);

    opacity:.65
  }
}


/* HOUSE */

.houseShell{
  position:absolute;
  left:50%;
  top:11%;
  transform:translateX(-50%);
  width:310px;
  height:270px
}

.houseBody{
  position:absolute;
  left:16px;
  right:16px;
  top:48px;
  bottom:0;
  background:
  linear-gradient(
    #47576a,
    #303b49
  );
  border:6px solid #1b2735
}

.roof{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:110px;
  background:#202c3a;
  clip-path:
  polygon(
    50
