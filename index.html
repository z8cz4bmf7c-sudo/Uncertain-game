<style>

}

}

button{

}

.btn{

/* PLAYER */

.person{
  position:absolute;
  z-index:18;
  left:50%;
  bottom:24%;
  width:62px;
  height:106px;
  transform:translateX(-50%);

  transition:
  bottom .12s linear,
  left .12s linear,
  transform .12s linear;
}

.shadow{
  position:absolute;
  left:50%;
  bottom:-4px;
  transform:translateX(-50%);

.head{

    #e8eef5,
    #c8d4df
  );
}

.leg{

  top:70px;
  width:13px;
  height:33px;
  border-radius:9px;
  background:#bcc9d5;
}

.leg.a{
  left:14px;
}

.leg.b{
  right:14px;
}

.person.walking .leg.a{
  animation:
  step .28s infinite alternate;
}

.person.walking .leg.b{
  animation:
  step .28s infinite alternate-reverse;
}

@keyframes step{

  to{
    transform:
    translateY(4px)
    rotate(9deg);
  }

}

#doubtVignette{

}
